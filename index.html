<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обби Батл: Мари против Ксеяо</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com"></script>
</head>
<body>
    <h1>👑 ОББИ БАТЛ: МАРИ 🐼 ПРОТИВ КСЕЯО 🐱</h1>
    <div class="setup-zone" id="setup">
        <div id="characterSelect">
            <button class="main-btn" style="background:#ff007f;color:#fff" onclick="selectChar('Мари')">🐼 Я Мари</button>
            <button class="main-btn" style="background:#00ffff;color:#000" onclick="selectChar('Ксеяо')">🐱 Я Ксеяо</button>
        </div>
        <div id="connControls" style="display:none">
            <button class="main-btn" onclick="startHost()">1. ХОСТ (Код)</button>
            <button class="main-btn" onclick="startClient()">2. КЛИЕНТ</button>
        </div>
        <div id="status">Выбери персонажа выше!</div>
    </div>
    <div class="info-panel">
        <div>⏳ Время: <span id="timer">0.00</span></div>
        <div>🐼 Мари: <span id="my-deaths">0</span> | 🐱 Ксеяо: <span id="friend-deaths">0</span></div>
    </div>
    <div id="gameWindow">
        <div class="platform" style="left:10px;bottom:40px;width:120px;height:15px"></div>
        <div class="platform" style="left:310px;bottom:140px;width:100px;height:15px"></div>
        <div id="movePlat1" class="platform moving-platform" style="left:170px;bottom:90px;width:100px;height:15px"></div>
        <div id="movePlat2" class="platform moving-platform" style="left:150px;bottom:190px;width:90px;height:15px"></div>
        <div class="platform" style="left:40px;bottom:230px;width:100px;height:15px"></div>
        <div class="finish-line" style="left:30px;bottom:280px;width:120px;height:20px">🏁 ФИНИШ</div>
        <div class="lava"></div>
    </div>
    <div class="controls">
        <button class="btn" onclick="moveLeft()">◀️</button>
        <button class="btn" onclick="jump()">🔼 ПРЫГ</button>
        <button class="btn" onclick="moveRight()">▶️</button>
    </div>
    <script>
        let peer,conn,isHost=false,myX=30,myY=60,frX=30,frY=60,vY=0,isGnd=false,jmpCnt=0,myDie=0,frDie=0;
        let name='',plat1X=170,p1Dir=1,plat2X=150,p2Dir=-1,isBonus=false,tX=-50,tY=40,tSpd=1.5,frTX=-50,frTY=40;
        const game=document.getElementById('gameWindow'),stat=document.getElementById('status');
        let myEl,frEl,myT,frT,startT=Date.now();

        function selectChar(n){
            name=n;
            stat.innerText="Выбран(а) "+n+"! Нажми ХОСТ или КЛИЕНТ.";
            document.getElementById('characterSelect').style.display='none';
            document.getElementById('connControls').style.display='block';
            
            // Заменили ломающиеся картинки на вечные крупные текстовые эмодзи
            myEl=createEl('player','me',`<div class="nickname">${name}</div><span style="font-size:35px">${n==='Мари'?'🐼':'🐱'}</span>`);
            frEl=createEl('player remote-player','',`<div class="nickname">${n==='Мари'?'Ксеяо':'Мари'}</div><span style="font-size:35px">${n==='Мари'?'🐱':'🐼'}</span>`);frEl.style.display='none';
            myT=createEl('player','myT',`<div class="nickname" style="color:#ffcc00;border:1px solid #ffcc00">🐺 ГРОМ ${name.toUpperCase()}</div><span style="font-size:35px">🐺</span>`);myT.style.display='none';
            frT=createEl('player','',`<div class="nickname" style="color:#00ffff;border:1px solid #00ffff">🐺 ГРОМ ${n==='Мари'?'КСЕЯО':'МАРИ'}</div><span style="font-size:35px">🐺</span>`);frT.style.display='none';
        }
        function createEl(c,id,h){let e=document.createElement('div');e.className=c;if(id)e.id=id;e.innerHTML=h;game.appendChild(e);return e}
        setInterval(()=>{if(conn&&conn.open)document.getElementById('timer').innerText=((Date.now()-startT)/1000).toFixed(2)},50);
        function startHost(){isHost=true;peer=new Peer();peer.on('open',id=>{stat.innerHTML=`Код: <b style="color:#fff;background:#333;padding:2px 6px;border-radius:4px">${id}</b>`});peer.on('connection',c=>{conn=c;net()})}
        function startClient(){isHost=false;let id=prompt("Код:");if(!id)return;peer=new Peer();peer.on('open',()=>{conn=peer.connect(id);net()})}
        
        function net(){
            stat.innerHTML="<span style='color:#00ff00'>⚡️ ИГРА НАЧАЛАСЬ! ⚡️</span>";document.getElementById('setup').style.background="rgba(0,255,0,0.08)";
            document.querySelectorAll('.btn').forEach(b=>b.style.display='inline-block');frEl.style.display='flex';startT=Date.now();
            conn.on('data',d=>{
                if(d.t==='sync'){frX=d.x;frY=d.y;frEl.style.left=frX+'px';frEl.style.bottom=frY+'px';if(d.b){frTX=d.tX;frTY=d.tY;frT.style.left=frTX+'px';frT.style.bottom=frTY+'px';if(!isBonus)bonus()}}
                if(d.t==='die'){frDie=d.d;if(name==='Мари')document.getElementById('friend-deaths').innerText=frDie;else document.getElementById('my-deaths').innerText=frDie}
            });
        }
        function send(){if(conn&&conn.open)conn.send({t:'sync',x:myX,y:myY,b:isBonus,tX:tX,tY:tY})}
        function bonus(){isBonus=true;document.querySelector('h1').innerText="🚨 ПОБЕГ ОТ ГРОМА! 🚨";game.style.borderColor="#ff3300";game.style.background="#1f0505";myT.style.display='flex';frT.style.display='flex';let f=document.querySelector('.finish-line');f.style.left="420px";f.style.bottom="40px";f.innerText="🏠 ШТАБ";startT=Date.now()}
        
        function physicsTick(){
            if(!conn||!conn.open)return;
            if(!isBonus){
                let p1=document.getElementById('movePlat1');plat1X+=2*p1Dir;if(plat1X>280||plat1X<120)p1Dir*=-1;p1.style.left=plat1X+'px';
                let p2=document.getElementById('movePlat2');plat2X+=1.5*p2Dir;if(plat2X>260||plat2X<60)p2Dir*=-1;p2.style.left=plat2X+'px';
            }else{
                // 🔥 УМНЫЙ ИИ ГРОМА: Теперь он бежит четко за тобой по X и по Y координат!
                tSpd+=0.001; 
                if (tX < myX) tX += tSpd; else if (tX > myX) tX -= tSpd;
                if (tY < myY) tY += tSpd; else if (tY > myY) tY -= tSpd;
                
                myT.style.left=tX+'px'; myT.style.bottom=tY+'px';
                
                // Проверка: Если Гром подобрался вплотную и укусил
                if(Math.abs(myX-tX)<25 && Math.abs(myY-tY)<25){ alert("🐺 Волкособ Гром догнал тебя!"); myX=30;myY=60;vY=0;tX=-50;tY=40;tSpd=1.5; }
            }
            if(!isGnd){vY-=0.45; myY+=vY}isGnd=false;
            document.querySelectorAll('.platform, .finish-line').forEach(p=>{
                let pL=parseInt(p.style.left),pB=parseInt(p.style.bottom),pW=parseInt(p.style.width),pH=parseInt(p.style.height);
                if(myX+35>=pL&&myX<=pL+pW&&myY<=pB+pH&&myY+vY>=pB){if(vY<=0){myY=pB+pH;vY=0;isGnd=true;jmpCnt=0;if(!isBonus){if(p.id==='movePlat1')myX+=2*p1Dir;if(p.id==='movePlat2')myX+=1.5*p2Dir}if(p.classList.contains('finish-line')){if(!isBonus){bonus();myX=30;myY=60}else{alert("🏆 ПОБЕДА! Ты в Штабе!");location.reload()}}}}
            });
            if(myY<=15){myDie++;if(name==='Мари')document.getElementById('my-deaths').innerText=myDie;else document.getElementById('friend-deaths').innerText=myDie;conn.send({t:'die',d:myDie});if(isBonus){tX=-50;tY=40;tSpd=1.5}myX=30;myY=60;vY=0}
            myEl.style.left=myX+'px';myEl.style.bottom=myY+'px';send();
        }
        setInterval(physicsTick,1000/60);
        function moveLeft(){if(myX>0)myX-=14;send()}function moveRight(){if(myX<game.clientWidth-45)myX+=14;send()}function jump(){if(isGnd||jmpCnt<2){vY=10;isGnd=false;jmpCnt++;send()}}
        window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')moveLeft();if(e.key==='ArrowRight'||e.key==='d')moveRight();if(e.key===' '||e.key==='w'||e.key==='ArrowUp')jump();});
    </script>
</body>
</html>
